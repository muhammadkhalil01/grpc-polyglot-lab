syntax = "proto3";

package user;

option go_package = "grpc-polyglot-lab/go-server/pb;pb";

message UserRequest {
  int32 user_id = 1;
}

message UserResponse {
  string name = 1;
  string email = 2;
  // Field tambahan untuk Tugas Evaluasi Mandiri pada modul.
  string phone = 3;
}

service UserService {
  rpc GetUserProfile(UserRequest) returns (UserResponse);
}
